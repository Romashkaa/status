<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Server status</title>
<style>
:root {
  --bg: #f5f5f7;
  --panel: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(60, 60, 67, .2);
  --mat: rgba(255, 255, 255, .72);
  --blur: blur(20px) saturate(180%);
  --accent: #0a84ff;
  --hover: #f0f0f3;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --gray: #8e8e93;
  --blue: #0a84ff;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --panel: #1c1c1e;
    --fg: #f5f5f7;
    --muted: #98989f;
    --line: rgba(255, 255, 255, .16);
    --mat: rgba(28, 28, 30, .72);
    --hover: #2a2a2d;
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --gray: #98989d;
    --blue: #0a84ff;
  }
}

* { box-sizing: border-box; }

html, body { margin: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
  background: var(--mat);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--line);
}

header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}

main {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sub {
  margin: 0 4px 6px;
  color: var(--muted);
  font-size: 14px;
}

.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  transition: border-color .2s ease;
}

.card:hover { border-color: var(--accent); }

.cover {
  position: absolute;
  inset: 0;
  border-radius: inherit;
}

.cover:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.card h2 {
  margin: 0 0 2px;
  font-size: 17px;
  font-weight: 600;
}

.card p {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

.card p a {
  position: relative;
  z-index: 1;
  color: var(--accent);
  text-decoration: none;
}

.card p a:hover { text-decoration: underline; }

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.pill {
  --c: var(--gray);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 16%, transparent);
  transition: color .3s ease, background-color .3s ease;
}

.pill::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.pill[data-state="online"] { --c: var(--green); }
.pill[data-state="late"] { --c: var(--orange); }
.pill[data-state="offline"] { --c: var(--red); }
.pill[data-state="pending"] { --c: var(--blue); }
.pill[data-state="unknown"] { --c: var(--gray); }
.pill[data-state="loading"] { --c: var(--gray); }

.pill[data-state="loading"]::before { animation: pulse 1.2s ease-in-out infinite; }

@keyframes pulse {
  50% { opacity: .3; }
}

.time {
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font: inherit;
  font-size: 14px;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  text-decoration: none;
  transition: filter .2s ease;
}

.btn:hover { filter: brightness(1.1); }

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .card, .pill, .btn { transition: none; }
  .pill[data-state="loading"]::before { animation: none; }
}
</style>
</head>
<body>
<header>
  <h1>Server status</h1>
  <a class="btn" href="https://t.me/RomashkaSystems">Channel</a>
</header>

<main>
  <p class="sub">Updates automatically every minute.</p>

  <section class="card">
    <a class="cover" href="https://quietpulse.xyz/status/2ef55dc4-ca03-463c-84ec-c39269c26345" aria-label="Open server status"></a>
    <h2>Server</h2>
    <p>Shows whether the server is running and has internet access.</p>
    <div class="row">
      <span class="pill" data-state="loading" data-src="https://quietpulse.xyz/api/jobs/2ef55dc4-ca03-463c-84ec-c39269c26345/badge.svg">Checking</span>
      <span class="time"></span>
    </div>
  </section>

  <section class="card">
    <a class="cover" href="https://quietpulse.xyz/status/e0ccf712-17c2-44bc-8f5d-4ca5ec1b9d48" aria-label="Open services status"></a>
    <h2>Services</h2>
    <p>Shows whether the data in the <a href="https://t.me/RomashkaSystems">channel</a> is up to date and being refreshed.</p>
    <div class="row">
      <span class="pill" data-state="loading" data-src="https://quietpulse.xyz/api/jobs/e0ccf712-17c2-44bc-8f5d-4ca5ec1b9d48/badge.svg">Checking</span>
      <span class="time"></span>
    </div>
  </section>
</main>

<script>
var STATES = [
  { re: /\bhealthy\b|\bok\b|\bup\b/i, state: "online", label: "Online" },
  { re: /\blate\b|\bdelayed\b/i, state: "late", label: "Delayed" },
  { re: /\bmissing\b|\bdown\b|\bfailed\b|\bmissed\b/i, state: "offline", label: "Offline" },
  { re: /\bnew\b|\bwaiting\b|\bpending\b/i, state: "pending", label: "Waiting" },
  { re: /\bunknown\b/i, state: "unknown", label: "Unknown" }
];

function parse(svg) {
  var doc = new DOMParser().parseFromString(svg, "image/svg+xml");
  var text = (doc.documentElement.textContent || "").replace(/\s+/g, " ");
  for (var i = 0; i < STATES.length; i++) {
    if (STATES[i].re.test(text)) return STATES[i];
  }
  return { state: "unknown", label: "Unknown" };
}

function apply(pill, result) {
  pill.dataset.state = result.state;
  pill.textContent = result.label;
  var time = pill.parentNode.querySelector(".time");
  time.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function load(pill) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 10000);
  fetch(pill.dataset.src + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal })
    .then(function (r) { return r.text(); })
    .then(function (svg) { apply(pill, parse(svg)); })
    .catch(function () { apply(pill, { state: "unknown", label: "Unknown" }); })
    .finally(function () { clearTimeout(timer); });
}

function refresh() {
  document.querySelectorAll(".pill[data-src]").forEach(load);
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
