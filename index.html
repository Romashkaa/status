<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Server status</title>
<style>
:root {
  --bg: #f5f5f7;
  --panel: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(60, 60, 67, .2);
  --mat: rgba(255, 255, 255, .72);
  --blur: blur(20px) saturate(180%);
  --accent: #0a84ff;
  --hover: #f0f0f3;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --gray: #8e8e93;
  --blue: #0a84ff;
  --pink: #ff2d55;
  --indigo: #5856d6;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --panel: #1c1c1e;
    --fg: #f5f5f7;
    --muted: #98989f;
    --line: rgba(255, 255, 255, .16);
    --mat: rgba(28, 28, 30, .72);
    --hover: #2a2a2d;
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --gray: #98989d;
    --blue: #0a84ff;
    --pink: #ff375f;
    --indigo: #5e5ce6;
  }
}

* { box-sizing: border-box; }

html, body { margin: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

header {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
  background: var(--mat);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--line);
}

header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}

main {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sub {
  margin: 0 4px 6px;
  color: var(--muted);
  font-size: 14px;
}

.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  transition: border-color .2s ease;
}

.card:hover { border-color: var(--accent); }

.card:has(.card-link:focus-visible) { border-color: var(--accent); }

.card h2 {
  margin: 0 0 2px;
  font-size: 17px;
  font-weight: 600;
}

.card-link {
  color: inherit;
  text-decoration: none;
}

.card-link::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  cursor: pointer;
}

.card-link:focus-visible {
  outline: none;
}

.card-link:focus-visible::after {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.card p {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

.card p.msg { min-height: 3em; }

.card p a {
  position: relative;
  z-index: 1;
  color: var(--accent);
  text-decoration: none;
}

.card p a:hover { text-decoration: underline; }

.title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.title h2 { margin: 0; }

.ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  color: var(--tile, var(--blue));
}

.ico svg { width: 26px; height: 26px; }

.ico-server { --tile: var(--blue); }
.ico-services { --tile: var(--indigo); }

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.pill {
  --c: var(--gray);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 16%, transparent);
  transition: color .3s ease, background-color .3s ease;
}

.pill::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.pill[data-state="online"] { --c: var(--green); }
.pill[data-state="late"] { --c: var(--orange); }
.pill[data-state="offline"] { --c: var(--red); }
.pill[data-state="pending"] { --c: var(--blue); }
.pill[data-state="unknown"] { --c: var(--gray); }
.pill[data-state="loading"] { --c: var(--gray); }

.pill[data-state="loading"]::before { animation: pulse 1.2s ease-in-out infinite; }

@keyframes pulse {
  50% { opacity: .3; }
}

.time {
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font: inherit;
  font-size: 14px;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  text-decoration: none;
  transition: filter .2s ease;
}

.btn svg {
  width: 15px;
  height: 15px;
  margin-right: 6px;
  flex: none;
}

.btn:hover { filter: brightness(1.1); }

.feedback {
  display: flex;
  justify-content: center;
  margin-top: 8px;
}

.btn-report {
  padding: 8px 18px;
  border-color: transparent;
  color: var(--pink);
  background: color-mix(in srgb, var(--pink) 14%, var(--panel));
  transition: background-color .2s ease, filter .2s ease;
}

.btn-report:hover {
  filter: none;
  background: color-mix(in srgb, var(--pink) 22%, var(--panel));
}

.btn-report:focus-visible {
  outline-color: var(--pink);
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .card, .pill, .btn { transition: none; }
  .pill[data-state="loading"]::before { animation: none; }
}
</style>
</head>
<body>
<header>
  <h1>Server status</h1>
  <a class="btn" href="https://t.me/RomashkaSystems"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4 18-7z"/></svg>Channel</a>
</header>

<main>
  <p class="sub">Updates automatically every minute.</p>

  <section class="card">
    <div class="title"><span class="ico ico-server"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span><h2><a class="card-link" href="https://quietpulse.xyz/status/2ef55dc4-ca03-463c-84ec-c39269c26345">Server</a></h2></div>
    <p class="msg" aria-live="polite">Checking the server…</p>
    <div class="row">
      <span class="pill" data-state="loading" data-key="server" data-src="https://quietpulse.xyz/api/jobs/2ef55dc4-ca03-463c-84ec-c39269c26345/badge.svg">Checking</span>
      <span class="time"></span>
    </div>
  </section>

  <section class="card">
    <div class="title"><span class="ico ico-services"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg></span><h2><a class="card-link" href="https://quietpulse.xyz/status/e0ccf712-17c2-44bc-8f5d-4ca5ec1b9d48">Services</a></h2></div>
    <p class="msg" aria-live="polite">Checking the services…</p>
    <div class="row">
      <span class="pill" data-state="loading" data-key="services" data-src="https://quietpulse.xyz/api/jobs/e0ccf712-17c2-44bc-8f5d-4ca5ec1b9d48/badge.svg">Checking</span>
      <span class="time"></span>
    </div>
  </section>

  <div class="feedback">
    <a
      class="btn btn-report"
      href="https://forms.gle/M2RTTSPE8Lpu8Dcc8"
      target="_blank"
      rel="noopener noreferrer"
    ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19L12 3.5z"/><path d="M12 10v4.5M12 17.5h.01"/></svg>Report an issue</a>
  </div>
</main>

<script>
var STATES = [
  { re: /\bhealthy\b|\bok\b|\bup\b/i, state: "online", label: "Online" },
  { re: /\blate\b|\bdelayed\b/i, state: "late", label: "Delayed" },
  { re: /\bmissing\b|\bdown\b|\bfailed\b|\bmissed\b/i, state: "offline", label: "Offline" },
  { re: /\bnew\b|\bwaiting\b|\bpending\b/i, state: "pending", label: "Waiting" },
  { re: /\bunknown\b/i, state: "unknown", label: "Unknown" }
];

function parse(svg) {
  var doc = new DOMParser().parseFromString(svg, "image/svg+xml");
  var text = (doc.documentElement.textContent || "").replace(/\s+/g, " ");
  for (var i = 0; i < STATES.length; i++) {
    if (STATES[i].re.test(text)) return STATES[i];
  }
  return { state: "unknown", label: "Unknown" };
}

var CH = "https://t.me/RomashkaSystems";

var MESSAGES = {
  server: {
    online: "The server is running and reachable, so all services should work as expected.",
    late: "We haven’t heard from the server in a while, so there may be a problem. Please wait a minute or two while the status updates.",
    offline: "The server is down for maintenance or a power issue. It will be back soon.",
    pending: "Waiting for the first check-in from the server.",
    unknown: 'The status is unavailable at the moment. Check the <a href="' + CH + '">Telegram channel</a> for any announcements about issues.'
  },
  services: {
    online: '<a href="' + CH + '">Channel</a> data is up to date and refreshing normally.',
    late: "The service missed a scheduled update, so the channel data may be stale. Please wait a minute or two while the status changes to Online or Offline.",
    offline: "The service that updates the channel is switched off, so the data in the channel (the table) may be outdated.",
    pending: "Waiting for the first update from the service.",
    unknown: 'The status is unavailable at the moment. Check the <a href="' + CH + '">Telegram channel</a> to see whether the data is up to date or if there are any announcements about issues.'
  }
};

function apply(pill, result) {
  pill.dataset.state = result.state;
  pill.textContent = result.label;
  var msg = pill.closest(".card").querySelector(".msg");
  var text = (MESSAGES[pill.dataset.key] || {})[result.state];
  if (msg && text) msg.innerHTML = text;
  var time = pill.parentNode.querySelector(".time");
  time.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function load(pill) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 10000);
  fetch(pill.dataset.src + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal })
    .then(function (r) { return r.text(); })
    .then(function (svg) { apply(pill, parse(svg)); })
    .catch(function () { apply(pill, { state: "unknown", label: "Unknown" }); })
    .finally(function () { clearTimeout(timer); });
}

function refresh() {
  document.querySelectorAll(".pill[data-src]").forEach(load);
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
