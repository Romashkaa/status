<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Server status</title>
<style>
:root {
  --bg: #f5f5f7;
  --panel: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(60, 60, 67, .16);
  --mat: rgba(255, 255, 255, .72);
  --blur: blur(20px) saturate(180%);
  --accent: #0a84ff;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --gray: #8e8e93;
  --blue: #0a84ff;
  --pink: #ff2d55;
  --yellow: #ffcc00;
  --yellow-text: #c98a00;
  --purple: #af52de;
  --glass: rgba(255, 255, 255, .55);
  --glass-edge: rgba(255, 255, 255, .8);
  --thumb: rgba(60, 60, 67, .12);
  --shadow: 0 14px 36px rgba(0, 0, 0, .14), 0 2px 8px rgba(0, 0, 0, .08);
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --panel: #1c1c1e;
    --fg: #f5f5f7;
    --muted: #98989f;
    --line: rgba(255, 255, 255, .14);
    --mat: rgba(28, 28, 30, .72);
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --gray: #98989d;
    --pink: #ff375f;
    --yellow: #ffd60a;
    --yellow-text: #ffd60a;
    --purple: #bf5af2;
    --glass: rgba(50, 50, 54, .5);
    --glass-edge: rgba(255, 255, 255, .16);
    --thumb: rgba(255, 255, 255, .16);
    --shadow: 0 14px 36px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 3;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 0;
}

.actions { display: flex; align-items: center; gap: 16px; }

.link {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
  transition: color .2s ease, opacity .2s ease;
}
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.link-channel { color: var(--accent); }

main { width: 100%; }

.panel.enter { animation: rise .4s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.hero {
  --c: var(--gray);
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}
.hero[data-state="online"]  { --c: var(--green); }
.hero[data-state="shutdown"] { --c: var(--orange); }
.hero[data-state="offline"] { --c: var(--red); }
.hero[data-state="pending"] { --c: var(--blue); }
.hero[data-state="maintenance"] { --c: var(--purple); }

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(60% 55% at 50% 38%, color-mix(in srgb, var(--c) 20%, transparent), transparent 72%);
}

.orb {
  position: relative;
  display: grid;
  place-items: center;
  width: 104px;
  height: 104px;
  border-radius: 50%;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 16%, transparent);
  box-shadow: 0 0 0 12px color-mix(in srgb, var(--c) 7%, transparent);
  margin-bottom: 36px;
}
.orb svg { width: 52px; height: 52px; }
.orb .badge {
  position: absolute;
  right: -4px;
  bottom: -4px;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  color: #fff;
  background: var(--yellow);
  box-shadow: 0 0 0 4px var(--bg);
}
.orb .badge svg { width: 26px; height: 26px; stroke-width: 2.2; }
.hero[data-state="loading"] .orb { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.big {
  margin: 0;
  font-size: clamp(36px, 8vw, 68px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -.03em;
}

.lead {
  max-width: 34em;
  margin: 18px 0 0;
  color: var(--muted);
  font-size: clamp(16px, 2.4vw, 19px);
  line-height: 1.5;
}

.meta {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 28px;
  font-size: 14px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meta a { font-weight: 600; }

.wrap { max-width: 720px; margin: 0 auto; padding: 96px 16px calc(120px + env(safe-area-inset-bottom, 0px)); }

.wrap h2 {
  margin: 0;
  text-align: center;
  font-size: 34px;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -.025em;
}
.summary { margin: 8px 0 28px; text-align: center; color: var(--muted); font-size: 16px; }

.notice summary {
  --c: var(--yellow-text);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  list-style: none;
  cursor: pointer;
  color: var(--c);
}
.notice summary::-webkit-details-marker { display: none; }
.notice summary::after {
  content: "";
  width: 7px;
  height: 7px;
  margin-top: -3px;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(45deg);
  transition: transform .2s ease;
}
.notice[open] summary::after { margin-top: 3px; transform: rotate(-135deg); }
.notice summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.notice[data-k="off"] summary   { --c: var(--red); }
.notice[data-k="shutdown"] summary { --c: var(--orange); }
.notice[data-k="maint"] summary { --c: var(--purple); }
.notice p { max-width: 34em; margin: 10px auto 0; font-size: 14px; line-height: 1.5; }

.list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 14px 20px 14px 0;
  font-size: 16px;
}
.item:nth-child(even) { padding: 14px 0 14px 20px; }
.item:nth-child(odd) { border-right: 1px solid var(--line); }
.item:nth-child(n+3) { border-top: 1px solid var(--line); }
.item .nm { min-width: 0; overflow-wrap: anywhere; }
.item .nm a { color: inherit; }
.item .nm a::after { content: "↗"; margin-left: 6px; font-size: .8em; color: var(--muted); }
.item .nm a:hover { color: var(--accent); text-decoration: none; }

.dot {
  --c: var(--gray);
  flex: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--c);
}
.dot[data-g="available"] { --c: var(--green); }
.dot[data-g="updating"]  { --c: var(--yellow); }
.dot[data-g="maint"]     { --c: var(--purple); }
.dot[data-g="issue"]     { --c: var(--red); }

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px 20px;
  margin: 0 0 12px;
  padding: 0;
  list-style: none;
  color: var(--muted);
  font-size: 14px;
}
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.legend .dot { width: 12px; height: 12px; }

@media (max-width: 560px) {
  .list { grid-template-columns: 1fr; }
  .item, .item:nth-child(even) { padding: 14px 0; }
  .item:nth-child(odd) { border-right: 0; }
  .item:nth-child(n+2) { border-top: 1px solid var(--line); }
}

.stamp { margin: 24px 0 0; text-align: center; color: var(--muted); font-size: 13px; }

.bar {
  width: 50%;
  height: 12px;
  border-radius: 6px;
  background: var(--line);
  animation: pulse 1.4s ease-in-out infinite;
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 44px 24px;
}
.empty .orb { --c: var(--gray); width: 76px; height: 76px; margin-bottom: 24px; box-shadow: 0 0 0 9px color-mix(in srgb, var(--c) 7%, transparent); }
.empty .orb svg { width: 38px; height: 38px; }
.empty.off .orb { --c: var(--red); }
.empty.shutdown .orb { --c: var(--orange); }
.empty.maint .orb { --c: var(--purple); }
.empty h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.empty p { margin: 10px 0 0; max-width: 26em; color: var(--muted); font-size: 15px; }

.dock {
  position: fixed;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr 1fr;
  max-width: calc(100% - 32px);
  padding: 5px;
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(200%);
  backdrop-filter: blur(28px) saturate(200%);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .35);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .dock { background: var(--panel); }
}

.thumb {
  position: absolute;
  top: 5px;
  bottom: 5px;
  left: 5px;
  width: calc((100% - 10px) / 2);
  border-radius: 999px;
  background: var(--thumb);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3);
  transition: transform .45s cubic-bezier(.3, 1.25, .5, 1);
}
.dock[data-active="services"] .thumb { transform: translateX(100%); }

.dock button {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 128px;
  padding: 10px 20px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: color .25s ease;
}
.dock button svg { width: 20px; height: 20px; flex: none; }
.dock button[aria-selected="true"] { color: var(--accent); }
.dock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (prefers-reduced-motion: reduce) {
  .panel.enter, .orb, .bar { animation: none !important; }
  .thumb, .dock button, .link, .notice summary::after { transition: none; }
}
</style>
</head>
<body>
<header>
  <div class="actions">
    <a class="link" href="https://forms.gle/M2RTTSPE8Lpu8Dcc8" target="_blank" rel="noopener noreferrer">Feedback</a>
    <a class="link link-channel" href="https://t.me/RomashkaSystems">Channel</a>
  </div>
</header>

<main>
  <section class="panel" id="panel-server" role="tabpanel" aria-labelledby="tab-server">
    <div class="hero" id="hero" data-state="loading">
      <div class="orb" id="orb" aria-hidden="true"></div>
      <h2 class="big" id="hero-title">Checking server…</h2>
      <p class="lead" id="hero-msg" aria-live="polite">Checking the server…</p>
      <div class="meta">
        <span id="hero-time"></span>
        <a href="https://quietpulse.xyz/status/2ef55dc4-ca03-463c-84ec-c39269c26345">Details</a>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-services" role="tabpanel" aria-labelledby="tab-services" hidden>
    <div class="wrap">
      <h2>Services</h2>
      <div class="summary" id="svc-summary">Checking the services…</div>
      <div id="svc-body"></div>
    </div>
  </section>

</main>

<nav class="dock" id="dock" role="tablist" aria-label="Sections" data-active="server">
  <span class="thumb" aria-hidden="true"></span>
  <button type="button" role="tab" id="tab-server" data-tab="server" aria-selected="true" aria-controls="panel-server"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>Server</button>
  <button type="button" role="tab" id="tab-services" data-tab="services" aria-selected="false" aria-controls="panel-services"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>Services</button>
</nav>

<script>
var CH = "https://t.me/RomashkaSystems";
var API_URL  = "https://api.github.com/repos/Romashkaa/status-data/contents/services.json?ref=main";
var DATA_URL = "https://raw.githubusercontent.com/Romashkaa/status-data/main/services.json";

var JOBS = {
  server: "https://quietpulse.xyz/api/jobs/2ef55dc4-ca03-463c-84ec-c39269c26345/badge.svg",
  bot:    "https://quietpulse.xyz/api/jobs/e0ccf712-17c2-44bc-8f5d-4ca5ec1b9d48/badge.svg"
};

var STATES = [
  { re: /\bhealthy\b|\bok\b|\bup\b/i, state: "online" },
  { re: /\blate\b|\bdelayed\b/i, state: "late" },
  { re: /\bmissing\b|\bdown\b|\bfailed\b|\bmissed\b|\bdisabled\b|\bpaused\b/i, state: "offline" },
  { re: /\bnew\b|\bwaiting\b|\bpending\b/i, state: "pending" },
  { re: /\bunknown\b/i, state: "offline" }
];

function parse(svg) {
  var doc = new DOMParser().parseFromString(svg, "image/svg+xml");
  var text = (doc.documentElement.textContent || "").replace(/\s+/g, " ");
  for (var i = 0; i < STATES.length; i++) {
    if (STATES[i].re.test(text)) return STATES[i].state;
  }
  return "unknown";
}

var gate = { server: "loading", bot: "loading" };
var checkedAt = { server: null, bot: null };
var svcData = null, svcFailed = false;

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function icon(paths) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + "</svg>";
}

var CLOCK = icon('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>');

var ICONS = {
  online:  icon('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  issue:   icon('<path d="M12 3.5l9.5 16.5h-19L12 3.5z"/><path d="M12 10v4.5M12 17.5h.01"/>'),
  offline: icon('<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>'),
  pending: icon('<path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="3"/>'),
  maintenance: icon('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'),
  unknown: icon('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>'),
  loading: icon('<path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="3"/>')
};

var SERVER_UI = {
  loading: ["Checking server…", "Checking the server…"],
  online:  ["Server is online", "The server is running and reachable, so all services should work as expected."],
  offline: ["Server issue", 'We’ve lost contact with the server, and this was not a planned shutdown. It may be a power or network issue. Check the <a href="' + CH + '">Telegram channel</a> for updates.'],
  shutdown: ["Server is turned off", 'The server was turned off on purpose, most likely for a longer time. Details are in the <a href="' + CH + '">Telegram channel</a>.'],
  maintenance: ["Technical maintenance", 'The server is temporarily stopped for planned maintenance and will be back soon. News and updates are in the <a href="' + CH + '">Telegram channel</a>.'],
  pending: ["Waiting for server", "Waiting for the first check-in from the server."],
  unknown: ["Status unknown", 'The status is unavailable at the moment. Check the <a href="' + CH + '">Telegram channel</a> for any announcements about issues.']
};

function supervisorStopped() {
  return !!svcData && (svcData.supervisor === "stopped" || svcData.supervisor === "stopping");
}

function serverState() {
  var st = gate.server;
  if (st === "online" || st === "late" || st === "offline") {
    if (!svcData && !svcFailed) return "loading";
    var planned = supervisorStopped();
    if (st === "offline") return planned ? "shutdown" : "offline";
    return planned ? "maintenance" : "online";
  }
  return st;
}

function renderServer() {
  var st = serverState(), ui = SERVER_UI[st] || SERVER_UI.unknown;
  var delayed = st === "online" && gate.server === "late";
  $("hero").dataset.state = st;
  $("orb").innerHTML = (ICONS[st] || ICONS.unknown) +
    (delayed ? '<span class="badge" role="img" aria-label="Check-in delayed" title="Check-in delayed">' + CLOCK + "</span>" : "");
  $("hero-title").textContent = ui[0];
  $("hero-msg").innerHTML = ui[1];
  $("hero-time").textContent = checkedAt.server ? "Checked " + checkedAt.server : "";
}

var GROUPS = {
  available:   "Available",
  maint:       "Maintenance",
  updating:    "Updating",
  issue:       "Issue",
  unavailable: "Unavailable"
};
var ORDER = ["issue", "updating", "maint", "available", "unavailable"];
var RANK = { issue: 0, updating: 1, maint: 1, available: 2, unavailable: 3 };
var BOT_STATUS = { online: "available", late: "available", pending: "updating", offline: "issue", unknown: "issue" };

function emptyState(kind, title, text) {
  var ic = kind === "off" ? ICONS.issue : kind === "shutdown" ? ICONS.offline : kind === "maint" ? ICONS.maintenance : ICONS.unknown;
  return '<div class="empty' + (kind ? " " + kind : "") + '"><div class="orb" aria-hidden="true">' +
    ic + "</div><h3>" + title + "</h3><p>" + text + "</p></div>";
}

function stampText() {
  if (!svcData || !svcData.changed_at) return "";
  var d = new Date(svcData.changed_at * 1000);
  return "Last change: " + d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

var noticeOpen = false;

function notice(kind, title, text) {
  return '<details class="notice" data-k="' + kind + '"' + (noticeOpen ? " open" : "") + "><summary>" + title + "</summary><p>" + text + "</p></details>";
}

function renderServices() {
  var body = $("svc-body"), sum = $("svc-summary");
  var bot = gate.bot, srv = gate.server;

  if (bot === "loading" || srv === "loading" || (!svcData && !svcFailed)) {
    sum.textContent = "Checking the services…";
    body.innerHTML = '<ul class="list" aria-hidden="true">' + '<li class="item"><span class="bar"></span></li>'.repeat(6) + "</ul>";
    return;
  }

  var items = svcData && Array.isArray(svcData.services) ? svcData.services : [];
  var up = srv === "online" || srv === "late";
  var planned = supervisorStopped();
  var link = '<a href="' + CH + '">Telegram channel</a>';
  var n = null;

  if (planned && srv === "offline") {
    n = ["shutdown", "Server is turned off",
      "The server was turned off on purpose, most likely for a longer time, so all services are unavailable. Details are in the " + link + "."];
  } else if (planned && up) {
    n = ["maint", "Technical maintenance",
      "Services are stopped for planned technical work and will be back soon. Services that were available are marked as under maintenance. News and updates are in the " + link + "."];
  } else if (srv === "offline") {
    n = ["off", "Server issue",
      "We’ve lost contact with the server, and this was not a planned shutdown. Services that were marked available may be having problems. Check the " + link + " for updates."];
  }

  if (!items.length) {
    if (n) {
      sum.textContent = "";
      body.innerHTML = emptyState(n[0], n[1], n[2]) + (stampText() ? '<p class="stamp">' + stampText() + "</p>" : "");
    } else {
      sum.textContent = "Service data is unavailable.";
      body.innerHTML = emptyState("", "No data right now", "Check the " + link + " for the latest status.");
    }
    return;
  }

  if (!n) {
    if (bot === "offline") {
      n = ["warn", "Data may be out of date", "The service that updates statuses is not responding, so this list may be out of date. The server itself is running."];
    } else if (bot === "pending" || srv === "pending") {
      n = ["warn", "Waiting for the first update", "Waiting for the first update from the service, so this data may be out of date."];
    } else if (svcData.stale) {
      n = ["warn", "Data may be out of date", "Status updates are temporarily unavailable, so this list may be out of date."];
    } else if (bot === "unknown" || srv === "unknown") {
      n = ["warn", "Can’t verify the data", "We couldn’t verify that this data is up to date. Check the " + link + " for announcements about issues."];
    }
  }

  items = items.filter(function (s) { return s.name !== "Status API"; })
    .concat([{ name: "Status API", status: BOT_STATUS[bot] || "issue", url: "" }]);

  var mode = n ? n[0] : "";
  var present = {}, avail = 0;
  var list = items.map(function (s) {
    var st = s.status;
    if (mode === "shutdown") st = "unavailable";
    else if (st === "available" && mode === "off") st = "issue";
    else if (st === "available" && mode === "maint") st = "maint";
    else if (mode === "maint" && s.name === "Status API") st = "maint";
    var g = GROUPS[st] ? st : "issue";
    present[g] = true;
    if (g === "available") avail++;
    return { g: g, s: s };
  });

  list.sort(function (a, b) { return RANK[a.g] - RANK[b.g]; });

  var rows = list.map(function (o) {
    var g = o.g, name = esc(o.s.name);
    if (g === "available" && /^https?:\/\//.test(o.s.url || "")) {
      name = '<a href="' + esc(o.s.url) + '" target="_blank" rel="noopener noreferrer">' + name + "</a>";
    }
    return '<li class="item"><span class="dot" data-g="' + g + '" role="img" aria-label="' + GROUPS[g] + '" title="' + GROUPS[g] + '"></span><span class="nm">' + name + "</span></li>";
  }).join("");

  var legend = ORDER.filter(function (g) { return present[g]; }).map(function (g) {
    return '<li><span class="dot" data-g="' + g + '" aria-hidden="true"></span>' + GROUPS[g] + "</li>";
  }).join("");

  if (n) {
    sum.innerHTML = notice(n[0], n[1], n[2]);
    var d = sum.querySelector("details");
    d.addEventListener("toggle", function () { noticeOpen = d.open; });
  } else {
    sum.textContent = avail === items.length ? "All services are available." : avail + " of " + items.length + " services available.";
  }

  body.innerHTML = '<ul class="legend">' + legend + '</ul><ul class="list">' + rows + "</ul>" +
    (stampText() ? '<p class="stamp">' + stampText() + "</p>" : "");
}

function loadJob(key) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 10000);
  fetch(JOBS[key] + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal })
    .then(function (r) { return r.text(); })
    .then(function (svg) { gate[key] = parse(svg); })
    .catch(function () { gate[key] = "unknown"; })
    .finally(function () {
      clearTimeout(timer);
      checkedAt[key] = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      renderServer();
      renderServices();
    });
}

function getJSON(url, opts) {
  return fetch(url, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}

function loadData() {
  getJSON(API_URL, { cache: "no-cache", headers: { Accept: "application/vnd.github.raw+json" } })
    .catch(function () { return getJSON(DATA_URL + "?t=" + Date.now(), { cache: "no-store" }); })
    .then(function (j) { svcData = j; svcFailed = false; })
    .catch(function () { svcFailed = true; })
    .finally(function () { renderServer(); renderServices(); });
}

var lastRefresh = 0;
function refresh() {
  lastRefresh = Date.now();
  loadJob("server");
  loadJob("bot");
  loadData();
}

function setTab(name, save) {
  if (name !== "server" && name !== "services") name = "server";
  $("dock").dataset.active = name;
  ["server", "services"].forEach(function (n) {
    var panel = $("panel-" + n), on = n === name;
    $("tab-" + n).setAttribute("aria-selected", on ? "true" : "false");
    if (on && panel.hidden) {
      panel.hidden = false;
      panel.classList.remove("enter");
      void panel.offsetWidth;
      panel.classList.add("enter");
    } else if (!on) {
      panel.hidden = true;
    }
  });
  if (save) {
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + name); } catch (e) {}
  }
}

document.querySelectorAll(".dock button").forEach(function (b) {
  b.addEventListener("click", function () { setTab(b.dataset.tab, true); });
});
window.addEventListener("hashchange", function () { setTab(location.hash.slice(1), false); });
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && Date.now() - lastRefresh > 15000) refresh();
});

renderServer();
renderServices();
setTab(location.hash.slice(1), false);
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
